# Voxtype — CPU-only setup
# engine selection happens in the wrapper; VOXTYPE_GPU is unset so
# /usr/bin/voxtype runs voxtype-avx512 or voxtype-avx2 (never vulkan)

engine = "whisper"

[whisper]
model = "small.en"
language = "en"
initial_prompt = "so I talked to Mike about the GNOME release, and honestly, he thinks we should wait a bit longer. we can test it on Fedora next week, after the update lands. does that sound okay to you? sounds good to me"

[hotkey]
enabled = true
key = "F14"
mode = "push_to_talk"

[osd]
enabled = false

[output]

[output.notification]
on_recording_start = false
on_transcription = false

[output.post_process]
command = '''sed -E 's/\.[[:space:]]*$//''''
