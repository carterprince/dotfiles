# Voxtype — small on the CPU by default. On the desktop,
# config/systemd/user/voxtype.service.d/gpu.conf sets VOXTYPE_GPU=1 (so the
# /usr/bin/voxtype wrapper runs voxtype-vulkan) and overrides the model with medium.en

engine = "whisper"

[whisper]
model = "small"
language = "en"
threads = 8
context_window_optimization = true
initial_prompt = "voxtype, workdir, my workdir, Neovim, WebDAV, libadwaita, reddit.com slash r slash linux, huggingface.co slash models, https://neocities.org slash signin, 308 Negra Arroyo Lane, Albuquerque, New Mexico\nso I talked to Mike about the GNOME release, and honestly, he thinks we should wait a bit longer. we can test it on Fedora next week, after the update lands. does that sound okay to you? sounds good to me\ncheck out config.toml in my dotfiles"

[hotkey]
enabled = true
key = "F14"  # Right Shift is mapped to F14 by config/udev/90-voxtype-keyboard.hwdb.
mode = "push_to_talk"

[osd]
enabled = false

[output]

[output.notification]
on_recording_start = false
on_transcription = false

[output.post_process]
# Spoken "colon", "slash" and "dot" become ":", "/" and "." (https colon slash slash reddit dot com slash r
# slash linux -> https://reddit.com/r/linux; localhost colon 8080 -> localhost:8080), then drop the trailing
# period. Punctuation Whisper puts right around the spoken word ("that, colon. you") is absorbed into it.
# "workdir" or "my workdir" is a placeholder for ~/.local/src/ (my workdir slash dotfiles -> ~/.local/src/dotfiles).
command = '''sed -E 's#(\<[Mm]y )?\<[Ww]ork[ -]?dir\>#~/.local/src/#g; s/[,.;!?]?[[:space:]]*\<[Cc]olon\>[,.;!?]?/:/g; s/[,.;!?]?[[:space:]]*\<[Ss]lash\>[,.;!?]?[[:space:]]*/\//g; s/[,.;!?]?[[:space:]]*\<[Dd]ot\>[,.;!?]?[[:space:]]*/./g; s/:[[:space:]]+([0-9])/:\1/g; s#(~/\.local/src)/+#\1/#g; s/\.[[:space:]]*$//''''
