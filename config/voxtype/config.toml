# Voxtype — small on the CPU by default. On the desktop,
# config/systemd/user/voxtype.service.d/gpu.conf sets VOXTYPE_GPU=1 (so the
# /usr/bin/voxtype wrapper runs voxtype-vulkan) and overrides the model with medium.en

engine = "whisper"

[whisper]
model = "small"
language = "en"
threads = 8
context_window_optimization = true
initial_prompt = "so I talked to Mike about the GNOME release, and honestly, he thinks we should wait a bit longer. we can test it on Fedora next week, after the update lands. does that sound okay to you? sounds good to me. voxtype, dotfiles, Neovim, WebDAV, libadwaita"

[hotkey]
enabled = true
key = "RIGHTCTRL"
mode = "push_to_talk"

[osd]
enabled = false

[output]

[output.notification]
on_recording_start = false
on_transcription = false

[output.post_process]
command = '''sed -E 's/\.[[:space:]]*$//''''
